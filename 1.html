# 민원처리 현황 시각화 개선 추진계획(안)

**구분:** 내부 검토용

**작성 목적:** 민원 처리 현황 집계 및 시각화 개선방안 검토

## 1. 추진 배경

민원 처리 현황을 더 쉽고 효율적으로 관리하기 위해 집계 및 시각화 방식 개선이 필요함.

## 2. 현황 및 문제점

| 구분 | 현황 | 문제점 |
| --- | --- | --- |
| 자료 취합 | 월말마다 여러 파일을 수작업으로 취합 | 반복적인 자료 정리 작업 발생 |
| 집계 기준 | 부서별 집계 기준이 일부 상이 | 집계 결과 재확인 반복 |
| 현황 파악 | 긴급 민원 및 장기 미처리 건 확인이 어려움 | 주요 관리 대상 식별에 제약 |

## 3. 추진 목표

- 공통 입력 양식을 통한 자료 관리 기준 표준화
- 기본 KPI 자동 계산을 통한 집계 업무 간소화
- 긴급 민원 및 장기 미처리 현황의 직관적인 시각화

## 4. 추진 방향

### 4-1. 입력 자료 표준화

- 자료 입력 항목 및 작성 기준을 통일하여 관리
- 담당 부서별 자료를 동일한 형식으로 취합

### 4-2. 지표 자동 집계

- 접수·처리·미처리 현황을 주요 지표로 구성
- 반복 계산을 줄일 수 있는 집계 구조 검토

### 4-3. 시각화 개선

- 핵심 현황을 한 화면에서 확인할 수 있도록 구성
- 긴급 및 장기 미처리 건을 구분해 관리할 수 있도록 설계

## 5. 기대 효과

- 수작업 취합 및 재확인 부담 완화
- 일관된 기준에 따른 자료 관리 가능
- 관리가 필요한 민원 현황의 빠른 파악

> 이 문서는 앞서 작성한 기획서 내용을 바탕으로 구성한 **포트폴리오용 예시**입니다. 실제 제출용 문서는 검토 후 사용하세요.

<script>
const $=id=>document.getElementById(id);
const sample=$('default-md').textContent.trim();
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_,label,url)=>'<a href="'+url.replace(/&quot;/g,'')+'" target="_blank" rel="noopener noreferrer">'+label+'</a>')}
function render(md){const lines=md.replace(/\r\n?/g,'\n').split('\n');let out='',i=0;while(i<lines.length){let line=lines[i],t=line.trim();if(!t){i++;continue}if(/^```/.test(t)){let lang=t.slice(3).trim(),chunk=[];i++;while(i<lines.length&&!/^```/.test(lines[i].trim()))chunk.push(lines[i++]);out+='<pre><code>'+esc(chunk.join('\n'))+'</code></pre>';i++;continue}let h=t.match(/^(#{1,3})\s+(.+)$/);if(h){let n=h[1].length;out+='<h'+n+'>'+inline(h[2])+'</h'+n+'>';i++;continue}if(/^(-{3,}|\*{3,})$/.test(t)){out+='<hr>';i++;continue}if(t.startsWith('> ')){let a=[];while(i<lines.length&&lines[i].trim().startsWith('> '))a.push(lines[i++].trim().slice(2));out+='<blockquote><p>'+inline(a.join(' '))+'</p></blockquote>';continue}if(t.includes('|')&&i+1<lines.length&&/^\|?[\s:\-|]+\|?$/.test(lines[i+1].trim())&&lines[i+1].includes('-')){const split=s=>s.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>x.trim());let cols=split(line);out+='<div class="table-wrap"><table><thead><tr>'+cols.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>';i+=2;while(i<lines.length&&lines[i].trim()&&lines[i].includes('|')){let cells=split(lines[i++]);out+='<tr>'+cols.map((_,j)=>'<td>'+inline(cells[j]||'')+'</td>').join('')+'</tr>'}out+='</tbody></table></div>';continue}if(/^[-*+]\s+/.test(t)||/^\d+\.\s+/.test(t)){let ordered=/^\d+\./.test(t),tag=ordered?'ol':'ul';out+='<'+tag+'>';while(i<lines.length&&(/^(?:[-*+]\s+|\d+\.\s+)/.test(lines[i].trim()))){out+='<li>'+inline(lines[i].trim().replace(/^(?:[-*+]\s+|\d+\.\s+)/,''))+'</li>';i++}out+='</'+tag+'>';continue}let parts=[t];i++;while(i<lines.length&&lines[i].trim()&&!/^(#{1,3}\s+|[-*+]\s+|\d+\.\s+|>|```|\|)/.test(lines[i].trim()))parts.push(lines[i++].trim());out+='<p>'+inline(parts.join(' '))+'</p>'}return out}
function show(md,name){$('content').innerHTML=render(md);$('filename').textContent=name;$('status').textContent=name==='PLANNING DOCUMENT · MARKDOWN'?'현재 예시 기획서를 표시하고 있습니다.':'불러온 파일: '+name}
$('choose').addEventListener('click',()=>$('file').click());$('file').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;if(f.size>3*1024*1024){$('status').textContent='3MB 이하의 문서를 선택해주세요.';return}try{show(await f.text(),f.name)}catch{$('status').textContent='파일을 읽지 못했습니다.'}});$('reset').addEventListener('click',()=>show(sample,'PLANNING DOCUMENT · MARKDOWN'));$('print').addEventListener('click',()=>window.print());$('year').textContent=new Date().getFullYear();show(sample,'PLANNING DOCUMENT · MARKDOWN');
</script>
