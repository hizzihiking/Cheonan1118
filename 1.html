<script type="text/plain" id="default-md">
# 민원처리 현황 시각화 개선 추진계획(안)

**구분:** 내부 검토용

**작성 목적:** 민원 처리 현황 집계 및 시각화 개선방안 검토

## 1. 추진 배경

민원 처리 현황을 더 쉽고 효율적으로 관리하기 위해 집계 및 시각화 방식 개선이 필요함.

## 2. 현황 및 문제점

| 구분 | 현황 | 문제점 |
| --- | --- | --- |
| 자료 취합 | 월말마다 여러 파일을 수작업으로 취합 | 반복적인 자료 정리 작업 발생 |
| 집계 기준 | 부서별 집계 기준이 일부 상이 | 집계 결과 재확인 반복 |
| 현황 파악 | 긴급 민원 및 장기 미처리 건 확인이 어려움 | 주요 관리 대상 식별에 제약 |

## 3. 추진 목표

- 공통 입력 양식을 통한 자료 관리 기준 표준화
- 기본 KPI 자동 계산을 통한 집계 업무 간소화
- 긴급 민원 및 장기 미처리 현황의 직관적인 시각화

## 4. 추진 방향

### 4-1. 입력 자료 표준화

- 자료 입력 항목 및 작성 기준을 통일하여 관리
- 담당 부서별 자료를 동일한 형식으로 취합

### 4-2. 지표 자동 집계

- 접수·처리·미처리 현황을 주요 지표로 구성
- 반복 계산을 줄일 수 있는 집계 구조 검토

### 4-3. 시각화 개선

- 핵심 현황을 한 화면에서 확인할 수 있도록 구성
- 긴급 및 장기 미처리 건을 구분해 관리할 수 있도록 설계

## 5. 기대 효과

- 수작업 취합 및 재확인 부담 완화
- 일관된 기준에 따른 자료 관리 가능
- 관리가 필요한 민원 현황의 빠른 파악

---

> 이 문서는 앞서 작성한 기획서 내용을 바탕으로 구성한 **포트폴리오용 예시**입니다. 실제 제출용 문서는 검토 후 사용하세요.

<script>
const $=id=>document.getElementById(id);
const sample=$('default-md').textContent.trim();
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_,label,url)=>'<a href="'+url.replace(/&quot;/g,'')+'" target="_blank" rel="noopener noreferrer">'+label+'</a>')}
function render(md){const lines=md.replace(/\r\n?/g,'\n').split('\n');let out='',i=0;while(i<lines.length){let line=lines[i],t=line.trim();if(!t){i++;continue}if(/^```/.test(t)){let lang=t.slice(3).trim(),chunk=[];i++;while(i<lines.length&&!/^```/.test(lines[i].trim()))chunk.push(lines[i++]);out+='<pre><code>'+esc(chunk.join('\n'))+'</code></pre>';i++;continue}let h=t.match(/^(#{1,3})\s+(.+)$/);if(h){let n=h[1].length;out+='<h'+n+'>'+inline(h[2])+'</h'+n+'>';i++;continue}if(/^(-{3,}|\*{3,})$/.test(t)){out+='<hr>';i++;continue}if(t.startsWith('> ')){let a=[];while(i<lines.length&&lines[i].trim().startsWith('> '))a.push(lines[i++].trim().slice(2));out+='<blockquote><p>'+inline(a.join(' '))+'</p></blockquote>';continue}if(t.includes('|')&&i+1<lines.length&&/^\|?[\s:\-|]+\|?$/.test(lines[i+1].trim())&&lines[i+1].includes('-')){const split=s=>s.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>x.trim());let cols=split(line);out+='<div class="table-wrap"><table><thead><tr>'+cols.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>';i+=2;while(i<lines.length&&lines[i].trim()&&lines[i].includes('|')){let cells=split(lines[i++]);out+='<tr>'+cols.map((_,j)=>'<td>'+inline(cells[j]||'')+'</td>').join('')+'</tr>'}out+='</tbody></table></div>';continue}if(/^[-*+]\s+/.test(t)||/^\d+\.\s+/.test(t)){let ordered=/^\d+\./.test(t),tag=ordered?'ol':'ul';out+='<'+tag+'>';while(i<lines.length&&(/^(?:[-*+]\s+|\d+\.\s+)/.test(lines[i].trim()))){out+='<li>'+inline(lines[i].trim().replace(/^(?:[-*+]\s+|\d+\.\s+)/,''))+'</li>';i++}out+='</'+tag+'>';continue}let parts=[t];i++;while(i<lines.length&&lines[i].trim()&&!/^(#{1,3}\s+|[-*+]\s+|\d+\.\s+|>|```|\|)/.test(lines[i].trim()))parts.push(lines[i++].trim());out+='<p>'+inline(parts.join(' '))+'</p>'}return out}
const STORAGE_KEY='yhj-md-archive-v1';
let docs=[], currentId='example', db=null;
const example={id:'example',name:'민원처리 현황 시각화 개선 추진계획(안).md',content:sample,added:Date.now(),example:true};
function announce(message){$('status').textContent=message}
function makeId(){return 'md-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10)}
function openDB(){return new Promise((resolve,reject)=>{if(!window.indexedDB){reject(new Error('IndexedDB not available'));return}let req=indexedDB.open('yhj-md-archive',1);req.onupgradeneeded=()=>{let d=req.result;if(!d.objectStoreNames.contains('documents'))d.createObjectStore('documents',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function txAll(){return new Promise((resolve,reject)=>{let t=db.transaction('documents','readonly');let r=t.objectStore('documents').getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function txPut(doc){return new Promise((resolve,reject)=>{let t=db.transaction('documents','readwrite');t.objectStore('documents').put(doc);t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}
function txDelete(id){return new Promise((resolve,reject)=>{let t=db.transaction('documents','readwrite');t.objectStore('documents').delete(id);t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}
let storage='memory';
async function initialize(){try{db=await openDB();docs=await txAll();storage='indexeddb'}catch(e){try{const raw=localStorage.getItem(STORAGE_KEY);docs=raw?JSON.parse(raw):[];storage='localstorage'}catch(err){docs=[];storage='memory';announce('이 브라우저에서는 저장 기능을 사용할 수 없습니다.')}}docs=docs.filter(x=>x&&typeof x.id==='string'&&typeof x.content==='string');$('year').textContent=new Date().getFullYear();renderList();selectDoc(docs[0]?.id||'example');if(storage==='memory')announce('현재 브라우저에서는 영구 저장이 지원되지 않습니다.');}
async function saveDoc(doc){if(storage==='indexeddb')await txPut(doc);else if(storage==='localstorage')localStorage.setItem(STORAGE_KEY,JSON.stringify([...docs,doc]));docs.unshift(doc)}
async function deleteDoc(id){if(storage==='indexeddb')await txDelete(id);else if(storage==='localstorage')localStorage.setItem(STORAGE_KEY,JSON.stringify(docs.filter(d=>d.id!==id)));docs=docs.filter(d=>d.id!==id)}
function renderList(){let q=$('search').value.trim().toLowerCase(),all=[example,...docs].filter(d=>d.name.toLowerCase().includes(q));$('count').textContent=docs.length+'개 저장';const box=$('file-list');box.replaceChildren();if(!all.length){let p=document.createElement('div');p.className='empty-list';p.textContent='검색 결과가 없습니다.';box.append(p);return}for(let d of all){let item=document.createElement('div');item.className='file-item'+(d.id===currentId?' selected':'');let open=document.createElement('button');open.type='button';open.className='file-open';open.setAttribute('aria-label',d.name+' 열기');let ico=document.createElement('span');ico.className='file-icon';ico.textContent=d.example?'📘':'📄';let details=document.createElement('span');details.className='file-details';let name=document.createElement('span');name.className='file-name';name.textContent=d.name;let date=document.createElement('span');date.className='file-date';date.textContent=d.example?'기본 제공 예시':'추가일 '+new Date(d.added).toLocaleDateString('ko-KR');details.append(name,date);open.append(ico,details);open.addEventListener('click',()=>selectDoc(d.id));item.append(open);if(!d.example){let del=document.createElement('button');del.className='remove';del.type='button';del.title='문서 삭제';del.setAttribute('aria-label',d.name+' 삭제');del.textContent='×';del.addEventListener('click',async()=>{if(!confirm('이 문서를 목록에서 삭제할까요?\n'+d.name))return;try{await deleteDoc(d.id);if(currentId===d.id)selectDoc(docs[0]?.id||'example');else renderList();announce('삭제했습니다: '+d.name)}catch(err){announce('삭제에 실패했습니다.')}});item.append(del)}box.append(item)}}
function selectDoc(id){let doc=id==='example'?example:docs.find(d=>d.id===id);if(!doc)doc=example;currentId=doc.id;$('content').innerHTML=render(doc.content);$('filename').textContent=doc.name;renderList();announce(doc.example?'예시 기획서를 표시하고 있습니다.':'선택한 문서: '+doc.name)}
async function addFiles(files){let added=0,failed=0;for(let f of files){if(!/\.(md|markdown)$/i.test(f.name)){failed++;continue}if(f.size>3*1024*1024){failed++;continue}try{let text=await f.text();let doc={id:makeId(),name:f.name,content:text,added:Date.now()};await saveDoc(doc);added++;if(added===1)currentId=doc.id}catch(e){failed++;if(storage==='localstorage')announce('저장 공간이 부족할 수 있습니다.')}}if(added){$('search').value='';selectDoc(currentId);announce(added+'개 문서를 추가했습니다.'+(failed?' '+failed+'개는 추가하지 못했습니다.':''))}else announce('추가된 문서가 없습니다. MD 파일(각 3MB 이하)을 선택해주세요.');$('file').value=''}
$('choose').addEventListener('click',()=>$('file').click());$('file').addEventListener('change',e=>addFiles([...e.target.files]));$('reset').addEventListener('click',()=>selectDoc('example'));$('print').addEventListener('click',()=>window.print());$('search').addEventListener('input',renderList);
$('download').addEventListener('click',()=>{let d=currentId==='example'?example:docs.find(x=>x.id===currentId);if(!d)return;let u=URL.createObjectURL(new Blob([d.content],{type:'text/markdown;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download=d.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});
const zone=$('dropzone');zone.addEventListener('click',()=>$('file').click());zone.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}});for(let name of ['dragenter','dragover'])zone.addEventListener(name,e=>{e.preventDefault();zone.classList.add('dragover')});for(let name of ['dragleave','drop'])zone.addEventListener(name,e=>{e.preventDefault();zone.classList.remove('dragover')});zone.addEventListener('drop',e=>addFiles([...e.dataTransfer.files]));initialize();
</script>
